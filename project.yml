name: APIDashboard
options:
  bundleIdPrefix: com.roblinger
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "ZLP7545528"
    CODE_SIGN_STYLE: Automatic

targets:
  APIDashboard:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
    entitlements:
      path: App/APIDashboard.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - group.com.roblinger.apidashboard
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.roblinger.apidashboard.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roblinger.APIDashboard
        PRODUCT_NAME: "API Dashboard"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
    dependencies:
      - target: APIDashboardWidgetExtension
        embed: true
        codeSign: true

  APIDashboardWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
      - path: Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: "API Spend"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/APIDashboardWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - group.com.roblinger.apidashboard
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.roblinger.apidashboard.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.roblinger.APIDashboard.Widget
        PRODUCT_NAME: "API Dashboard Widget"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES

schemes:
  APIDashboard:
    build:
      targets:
        APIDashboard: all
        APIDashboardWidgetExtension: all
    run:
      config: Debug
    archive:
      config: Release
